<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <title>Ankyra Timer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --bg: #050505;
      --surface: #171719;
      --surface-hover: #232326;
      --track: #343438;
      --text: #f7f7f8;
      --muted: #98989f;
      --accent: #7b78ff;
      --accent-soft: #9d9aff;
      --danger: #ee342d;
      --ring-size: min(78vw, 440px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: min(100%, 560px);
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
    }

    .topbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand strong {
      font-size: 1rem;
      letter-spacing: .18em;
    }

    .brand span {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s ease, transform .15s ease;
    }

    .icon-button:hover {
      background: var(--surface);
    }

    .icon-button:active {
      transform: scale(.92);
    }

    .icon-button svg {
      width: 30px;
      height: 30px;
    }

    .timer-stage {
      display: grid;
      place-items: center;
      align-content: center;
      min-height: 440px;
    }

    .timer-ring {
      width: var(--ring-size);
      height: var(--ring-size);
      position: relative;
      display: grid;
      place-items: center;
    }

    .timer-ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: rotate(-90deg);
    }

    .ring-track,
    .ring-progress {
      fill: none;
      stroke-width: 4.6;
    }

    .ring-track {
      stroke: var(--track);
    }

    .ring-progress {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset .35s linear, stroke .25s ease;
    }

    .timer-ring.done .ring-progress {
      stroke: var(--accent-soft);
    }

    .timer-content {
      width: 74%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 1;
    }

    .total-duration {
      color: #c7c7cb;
      font-size: clamp(.9rem, 3.6vw, 1.2rem);
      min-height: 1.5em;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      font-size: clamp(3.05rem, 14vw, 5.5rem);
      line-height: 1;
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .finish-time {
      color: #d3d3d7;
      font-size: clamp(.88rem, 3.5vw, 1.1rem);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 1.5em;
    }

    .finish-time svg {
      position: static;
      width: 18px;
      height: 18px;
      transform: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .action-button {
      min-height: 62px;
      padding: 16px 20px;
      border: 0;
      border-radius: 999px;
      font-weight: 650;
      font-size: 1.05rem;
      cursor: pointer;
      transition: filter .2s ease, transform .15s ease;
    }

    .action-button:active {
      transform: scale(.97);
    }

    .action-button:hover {
      filter: brightness(1.08);
    }

    .secondary {
      background: #2e2e31;
    }

    .primary {
      background: var(--danger);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, .66);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(100%, 560px);
      transform: translate(-50%, 105%);
      background: #161618;
      border-radius: 28px 28px 0 0;
      padding: 12px 24px max(28px, env(safe-area-inset-bottom));
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }

    .sheet-backdrop.open .sheet {
      transform: translate(-50%, 0);
    }

    .handle {
      width: 42px;
      height: 5px;
      margin: 0 auto 22px;
      border-radius: 10px;
      background: #4a4a4f;
    }

    .sheet h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .sheet-copy {
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 24px;
    }

    .duration-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .duration-field {
      min-width: 0;
      text-align: center;
    }

    .duration-field input {
      width: 100%;
      height: 68px;
      border: 1px solid #3a3a3f;
      border-radius: 16px;
      outline: 0;
      background: #222225;
      color: var(--text);
      text-align: center;
      font-size: 1.65rem;
      font-variant-numeric: tabular-nums;
    }

    .duration-field input:focus {
      border-color: var(--accent);
    }

    .duration-field label {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      margin-top: 7px;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .colon {
      color: var(--muted);
      font-size: 1.5rem;
      margin-bottom: 24px;
    }

    input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }

    .presets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 20px;
      scrollbar-width: none;
    }

    .presets::-webkit-scrollbar {
      display: none;
    }

    .preset {
      flex: 0 0 auto;
      border: 1px solid #39393d;
      border-radius: 999px;
      background: #242427;
      padding: 10px 14px;
      color: #d6d6da;
      cursor: pointer;
    }

    .preset.selected {
      border-color: var(--accent);
      background: rgba(123, 120, 255, .16);
      color: #c4c2ff;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px;
    }

    .sheet-button {
      min-height: 54px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 650;
    }

    .sheet-button.cancel {
      background: #2c2c30;
    }

    .sheet-button.set {
      background: var(--accent);
      color: #09090b;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 680px) {
      :root {
        --ring-size: min(65vh, 72vw, 390px);
      }

      .timer-stage {
        min-height: 330px;
      }

      .app {
        gap: 8px;
      }
    }

    @media (min-width: 700px) {
      .app {
        padding-inline: 36px;
      }

      .action-button {
        min-height: 68px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Ankyra timer">
        <strong>ANKYRA</strong>
        <span>Timer</span>
      </div>
      <button class="icon-button" id="open-settings" type="button" aria-label="Set timer duration">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 5v22M5 16h22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <section class="timer-stage" aria-label="Countdown timer">
      <div class="timer-ring" id="timer-ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="46"></circle>
          <circle class="ring-progress" id="ring-progress" cx="50" cy="50" r="46"></circle>
        </svg>
        <div class="timer-content">
          <div class="total-duration" id="total-duration">2 h</div>
          <time class="time" id="time-display" aria-live="polite">2:00:00</time>
          <div class="finish-time" id="finish-time">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 8.5h18C21 15 18 15 18 8ZM9.5 19a2.7 2.7 0 0 0 5 0" fill="currentColor"/>
            </svg>
            <span id="finish-time-text">Ends at —</span>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="action-button secondary" id="reset-button" type="button">Delete</button>
      <button class="action-button primary" id="toggle-button" type="button">Start</button>
    </div>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="handle" aria-hidden="true"></div>
      <h2 id="sheet-title">Set timer</h2>
      <p class="sheet-copy">Choose how long you want to focus.</p>

      <div class="duration-inputs">
        <div class="duration-field">
          <label for="hours">Hours</label>
          <input id="hours" type="number" inputmode="numeric" min="0" max="99" value="2">
        </div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="duration-field">
          <label for="minutes">Minutes</label>
          <input id="minutes" type="number" inputmode="numeric" min="0" max="59" value="0">
        </div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="duration-field">
          <label for="seconds">Seconds</label>
          <input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="0">
        </div>
      </div>

      <div class="presets" aria-label="Timer presets">
        <button class="preset" type="button" data-minutes="5">5 min</button>
        <button class="preset" type="button" data-minutes="15">15 min</button>
        <button class="preset" type="button" data-minutes="25">25 min</button>
        <button class="preset" type="button" data-minutes="45">45 min</button>
        <button class="preset" type="button" data-minutes="60">1 hour</button>
        <button class="preset selected" type="button" data-minutes="120">2 hours</button>
      </div>

      <div class="sheet-actions">
        <button class="sheet-button cancel" id="cancel-settings" type="button">Cancel</button>
        <button class="sheet-button set" id="set-timer" type="button">Set timer</button>
      </div>
    </section>
  </div>

  <div class="sr-only" id="status-announcement" aria-live="assertive"></div>

  <script>
    (() => {
      const STORAGE_KEY = "ankyra-timer-v2";
      const circumference = 2 * Math.PI * 46;

      const elements = {
        display: document.getElementById("time-display"),
        total: document.getElementById("total-duration"),
        finish: document.getElementById("finish-time-text"),
        progress: document.getElementById("ring-progress"),
        ring: document.getElementById("timer-ring"),
        toggle: document.getElementById("toggle-button"),
        reset: document.getElementById("reset-button"),
        open: document.getElementById("open-settings"),
        backdrop: document.getElementById("sheet-backdrop"),
        cancel: document.getElementById("cancel-settings"),
        set: document.getElementById("set-timer"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
        announcement: document.getElementById("status-announcement")
      };

      let state = {
        totalSeconds: 7200,
        remainingSeconds: 7200,
        running: false,
        endAt: null,
        completed: false
      };
      let intervalId = null;

      elements.progress.style.strokeDasharray = String(circumference);

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved || !Number.isFinite(saved.totalSeconds)) return;
          state = { ...state, ...saved };
          if (state.running && state.endAt) {
            state.remainingSeconds = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
            if (state.remainingSeconds === 0) finishTimer(false);
          }
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, Number(value) || 0));
      }

      function parts(seconds) {
        const safe = Math.max(0, Math.round(seconds));
        return {
          hours: Math.floor(safe / 3600),
          minutes: Math.floor((safe % 3600) / 60),
          seconds: safe % 60
        };
      }

      function formatTime(seconds) {
        const value = parts(seconds);
        if (value.hours > 0) {
          return `${value.hours}:${String(value.minutes).padStart(2, "0")}:${String(value.seconds).padStart(2, "0")}`;
        }
        return `${value.minutes}:${String(value.seconds).padStart(2, "0")}`;
      }

      function formatTotal(seconds) {
        const value = parts(seconds);
        const labels = [];
        if (value.hours) labels.push(`${value.hours} h`);
        if (value.minutes) labels.push(`${value.minutes} min`);
        if (!labels.length && value.seconds) labels.push(`${value.seconds} sec`);
        return labels.join(" ") || "Timer";
      }

      function formatClock(timestamp) {
        return new Intl.DateTimeFormat(undefined, {
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(timestamp));
      }

      function updateView() {
        const ratio = state.totalSeconds > 0
          ? Math.min(1, Math.max(0, state.remainingSeconds / state.totalSeconds))
          : 0;

        elements.display.textContent = formatTime(state.remainingSeconds);
        elements.display.setAttribute("datetime", `PT${Math.round(state.remainingSeconds)}S`);
        elements.total.textContent = state.completed ? "Time complete" : formatTotal(state.totalSeconds);
        elements.progress.style.strokeDashoffset = String(circumference * (1 - ratio));
        elements.ring.classList.toggle("done", state.completed);

        if (state.running && state.endAt) {
          elements.finish.textContent = `Ends at ${formatClock(state.endAt)}`;
        } else if (state.completed) {
          elements.finish.textContent = "Finished";
        } else {
          elements.finish.textContent = "Ready when you are";
        }

        elements.toggle.textContent = state.running ? "Pause" : state.completed ? "Restart" : state.remainingSeconds < state.totalSeconds ? "Resume" : "Start";
        document.title = state.running ? `${formatTime(state.remainingSeconds)} · Ankyra` : "Ankyra Timer";
      }

      function startTicker() {
        clearInterval(intervalId);
        intervalId = window.setInterval(tick, 250);
      }

      function tick() {
        if (!state.running || !state.endAt) return;
        const next = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
        if (next !== state.remainingSeconds) {
          state.remainingSeconds = next;
          updateView();
          saveState();
        }
        if (next === 0) finishTimer(true);
      }

      function startTimer() {
        if (state.completed || state.remainingSeconds <= 0) {
          state.remainingSeconds = state.totalSeconds;
          state.completed = false;
        }
        state.running = true;
        state.endAt = Date.now() + state.remainingSeconds * 1000;
        saveState();
        updateView();
        startTicker();
      }

      function pauseTimer() {
        tick();
        state.running = false;
        state.endAt = null;
        clearInterval(intervalId);
        saveState();
        updateView();
        elements.announcement.textContent = `Timer paused with ${formatTime(state.remainingSeconds)} remaining.`;
      }

      function finishTimer(playSound) {
        state.running = false;
        state.remainingSeconds = 0;
        state.endAt = null;
        state.completed = true;
        clearInterval(intervalId);
        saveState();
        updateView();
        elements.announcement.textContent = "Timer complete.";
        if (playSound) signalCompletion();
        if ("vibrate" in navigator) navigator.vibrate([160, 90, 160]);
      }

      function signalCompletion() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const context = new AudioContext();
          [0, .22, .44].forEach((delay, index) => {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = index === 2 ? 880 : 660;
            gain.gain.setValueAtTime(.0001, context.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(.22, context.currentTime + delay + .02);
            gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + delay + .16);
            oscillator.connect(gain).connect(context.destination);
            oscillator.start(context.currentTime + delay);
            oscillator.stop(context.currentTime + delay + .18);
          });
        } catch (_) {}
      }

      function deleteTimer() {
        clearInterval(intervalId);
        state = {
          totalSeconds: 0,
          remainingSeconds: 0,
          running: false,
          endAt: null,
          completed: false
        };
        saveState();
        updateView();
        openSheet();
      }

      function openSheet() {
        const value = parts(state.totalSeconds || 7200);
        elements.hours.value = value.hours;
        elements.minutes.value = value.minutes;
        elements.seconds.value = value.seconds;
        updatePresetSelection();
        elements.backdrop.classList.add("open");
        elements.backdrop.setAttribute("aria-hidden", "false");
        window.setTimeout(() => elements.hours.focus(), 300);
      }

      function closeSheet() {
        elements.backdrop.classList.remove("open");
        elements.backdrop.setAttribute("aria-hidden", "true");
        elements.open.focus();
      }

      function readDuration() {
        const hours = clamp(elements.hours.value, 0, 99);
        const minutes = clamp(elements.minutes.value, 0, 59);
        const seconds = clamp(elements.seconds.value, 0, 59);
        elements.hours.value = hours;
        elements.minutes.value = minutes;
        elements.seconds.value = seconds;
        return hours * 3600 + minutes * 60 + seconds;
      }

      function setTimer() {
        const totalSeconds = readDuration();
        if (totalSeconds <= 0) {
          elements.minutes.value = 1;
          elements.minutes.focus();
          return;
        }
        clearInterval(intervalId);
        state = {
          totalSeconds,
          remainingSeconds: totalSeconds,
          running: false,
          endAt: null,
          completed: false
        };
        saveState();
        updateView();
        closeSheet();
        elements.announcement.textContent = `Timer set for ${formatTotal(totalSeconds)}.`;
      }

      function updatePresetSelection() {
        const currentMinutes = readDuration() / 60;
        document.querySelectorAll(".preset").forEach(button => {
          button.classList.toggle("selected", Number(button.dataset.minutes) === currentMinutes);
        });
      }

      elements.toggle.addEventListener("click", () => {
        if (state.totalSeconds <= 0) return openSheet();
        state.running ? pauseTimer() : startTimer();
      });
      elements.reset.addEventListener("click", deleteTimer);
      elements.open.addEventListener("click", openSheet);
      elements.cancel.addEventListener("click", closeSheet);
      elements.set.addEventListener("click", setTimer);
      elements.backdrop.addEventListener("click", event => {
        if (event.target === elements.backdrop) closeSheet();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && elements.backdrop.classList.contains("open")) closeSheet();
        if (event.code === "Space" && !elements.backdrop.classList.contains("open")) {
          event.preventDefault();
          elements.toggle.click();
        }
      });
      document.querySelectorAll(".duration-field input").forEach(input => {
        input.addEventListener("input", updatePresetSelection);
      });
      document.querySelectorAll(".preset").forEach(button => {
        button.addEventListener("click", () => {
          const presetMinutes = Number(button.dataset.minutes);
          elements.hours.value = Math.floor(presetMinutes / 60);
          elements.minutes.value = presetMinutes % 60;
          elements.seconds.value = 0;
          updatePresetSelection();
        });
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) tick();
      });

      loadState();
      updateView();
      if (state.running) startTicker();
    })();
  </script>
</body>
</html>
